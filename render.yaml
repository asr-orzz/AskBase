services:
  # Backend API
  - type: web
    name: ragops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ragops-db
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: ragops-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # Frontend
  - type: web
    name: ragops-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
        # Set this to: https://ragops-api.onrender.com/api/v1

databases:
  - name: ragops-db
    plan: free
    databaseName: ragops
    user: ragops
