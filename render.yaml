services:
  # Backend API
  - type: web
    name: ragops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ragops-db
          property: connectionString
      - key: DATABASE_SYNC_URL
        fromDatabase:
          name: ragops-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

databases:
  - name: ragops-db
    plan: free
    databaseName: ragops
    user: ragops
