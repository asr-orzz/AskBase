services:
  # ── Backend API ──
  - type: web
    name: ragops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ragops-db
          property: connectionURI
        # Render gives postgres://, we need postgresql+asyncpg://
      - key: QDRANT_HOST
        value: "" # Set to your Qdrant Cloud host
      - key: QDRANT_PORT
        value: "6333"
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: ragops-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # ── Celery Worker ──
  - type: worker
    name: ragops-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=2 -Q default,sync,ingest,eval
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          name: ragops-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ragops-db
          property: connectionURI
      - key: REDIS_URL
        fromService:
          name: ragops-redis
          type: redis
          property: connectionString
      - key: QDRANT_HOST
        fromService:
          name: ragops-api
          type: web
          envVarKey: QDRANT_HOST
      - key: QDRANT_API_KEY
        fromService:
          name: ragops-api
          type: web
          envVarKey: QDRANT_API_KEY
      - key: OPENAI_API_KEY
        fromService:
          name: ragops-api
          type: web
          envVarKey: OPENAI_API_KEY

  # ── Frontend ──
  - type: web
    name: ragops-frontend
    runtime: node
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    plan: starter
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: ragops-api
          type: web
          property: hostport
      - key: NODE_ENV
        value: production

  # ── Redis ──
  - type: redis
    name: ragops-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: ragops-db
    plan: starter
    databaseName: ragops
    user: ragops
    postgresMajorVersion: "16"
